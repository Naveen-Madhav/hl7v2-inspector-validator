[theme]
base = "light"
primaryColor = "#206bc4"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#182433"
font = "sans serif"
baseFontSize = 16
baseRadius = "0.5rem"
borderColor = "#dce1e7"

[server]
maxUploadSize = 1
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
