[theme]
base = "light"
primaryColor = "#004643"
backgroundColor = "#F0EDE5"
secondaryBackgroundColor = "#ffffff"
textColor = "#18302d"
font = "sans serif"
baseFontSize = 16
baseRadius = "0.5rem"
borderColor = "#d9d7ce"

[server]
maxUploadSize = 5
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
